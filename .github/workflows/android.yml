
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: |
          rm -rf android
          flutter create --platforms=android --org com.example --project-name echo_fx .

      - name: Install audio engine
        run: |
          mkdir -p android/app/src/main/kotlin/com/example/echo_fx
          cp native/MainActivity.kt android/app/src/main/kotlin/com/example/echo_fx/MainActivity.kt
          python3 -c "p='android/app/src/main/AndroidManifest.xml';s=open(p).read();s=s.replace('<application', '<uses-permission android:name=\"android.permission.RECORD_AUDIO\"/>\\n    <application', 1);open(p,'w').write(s)"

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ECHO-FX-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          